# PayNest local environment.
#
#   Infrastructure only (run services from the IDE):  docker compose -f infra/docker-compose.yml up -d
#   Whole system (build jars first: ./mvnw package -DskipTests):
#                                                      docker compose -f infra/docker-compose.yml --profile apps up -d --build
#   Extras: --profile tools (Kafka UI :8090), --profile monitoring (Prometheus :9090, Grafana :3000)

name: paynest

x-app: &app
  profiles: ["apps"]
  restart: unless-stopped

x-app-env: &app-env
  JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-at-least-32-bytes}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:-wallet_pass}
      TRANSFER_DB_PASSWORD: ${TRANSFER_DB_PASSWORD:-transfer_pass}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger_pass}
    # Host port 5433, so it does not clash with a PostgreSQL installed directly on the machine.
    ports: ["5433:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:8.0.34
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20

  redis:
    image: redis:8.6.8
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # Single-node Kafka in KRaft mode (no ZooKeeper). Two listeners:
  # kafka:29092 for containers, localhost:9092 for services started from the IDE.
  kafka:
    image: apache/kafka:4.3.2
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: ["tools"]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: paynest
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka: { condition: service_healthy }

  # ---------------------------------------------------------------- services
  user-service:
    <<: *app
    build: ../services/user-service
    image: paynest/user-service:local
    ports: ["8081:8081"]
    environment:
      <<: *app-env
      SPRING_MONGODB_URI: mongodb://mongo:27017/paynest_users
    depends_on:
      mongo: { condition: service_healthy }

  wallet-service:
    <<: *app
    build: ../services/wallet-service
    image: paynest/wallet-service:local
    ports: ["8082:8082"]
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet_db
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:-wallet_pass}
      PAYNEST_BANK_URL: http://bank-adapter:8085
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  transfer-service:
    <<: *app
    build: ../services/transfer-service
    image: paynest/transfer-service:local
    ports: ["8083:8083"]
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transfer_db
      TRANSFER_DB_PASSWORD: ${TRANSFER_DB_PASSWORD:-transfer_pass}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  ledger-service:
    <<: *app
    build: ../services/ledger-service
    image: paynest/ledger-service:local
    ports: ["8084:8084"]
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger_db
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger_pass}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  bank-adapter:
    <<: *app
    build: ../services/bank-adapter
    image: paynest/bank-adapter:local
    ports: ["8085:8085"]
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75

  notification-service:
    <<: *app
    build: ../services/notification-service
    image: paynest/notification-service:local
    ports: ["8086:8086"]
    environment:
      <<: *app-env
      SPRING_MONGODB_URI: mongodb://mongo:27017/paynest_notifications
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  api-gateway:
    <<: *app
    build: ../services/api-gateway
    image: paynest/api-gateway:local
    ports: ["8080:8080"]
    environment:
      <<: *app-env
      SPRING_DATA_REDIS_HOST: redis
      USER_SERVICE_URL: http://user-service:8081
      WALLET_SERVICE_URL: http://wallet-service:8082
      TRANSFER_SERVICE_URL: http://transfer-service:8083
      LEDGER_SERVICE_URL: http://ledger-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
    depends_on:
      redis: { condition: service_healthy }

  # ---------------------------------------------------------------- monitoring
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["monitoring"]
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.2.5
    profiles: ["monitoring"]
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  postgres-data:
  mongo-data:
