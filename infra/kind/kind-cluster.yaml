# kind create cluster --config infra/kind/kind-cluster.yaml
# The gateway's NodePort 30080 is published on http://localhost:8000.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: paynest
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8000
        protocol: TCP
