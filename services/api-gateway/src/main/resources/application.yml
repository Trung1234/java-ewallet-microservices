server:
  port: 8080
  # Finish running requests when the container stops.
  shutdown: graceful

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            # Token bucket in Redis, shared by all gateway instances. Over the limit -> 429.
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:40}
                key-resolver: "#{@principalOrIpKeyResolver}"
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**,/users/**
            - id: wallet-service
              uri: ${WALLET_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/wallets/**
            - id: transfer-service
              uri: ${TRANSFER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/transfers/**
            - id: ledger-service
              uri: ${LEDGER_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/ledger/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/notifications/**,/preferences/**

paynest:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-at-least-32-bytes}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
