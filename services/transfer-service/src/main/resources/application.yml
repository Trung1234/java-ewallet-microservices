server:
  port: 8083
  # Finish running requests when the container stops.
  shutdown: graceful

spring:
  application:
    name: transfer-service
  datasource:
    url: jdbc:postgresql://localhost:5433/transfer_db
    username: transfer_user
    password: ${TRANSFER_DB_PASSWORD:transfer_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 15000
    consumer:
      auto-offset-reset: earliest

paynest:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-at-least-32-bytes}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
